name: Agent

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt to send to the agent"
        required: true
        default: "Review this repository and write a short review to REPORT.md using the write_file tool. Then summarise your review in the reply."
      model:
        description: "Mistral model (optional)"
        required: false
        default: ""
      continue_from:
        description: "Resume the previous run's conversation memory?"
        required: false
        default: previous
        type: choice
        options:
          - previous
          - fresh
      commit_report:
        description: "Commit REPORT.md to main when the agent wrote one"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: agent-run
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore previous conversation memory
        if: ${{ inputs.continue_from == 'previous' || github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow agent.yml --status success \
            --json databaseId --limit 20 \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }})][0].databaseId // empty")
          if [ -n "$previous_id" ]; then
            echo "Restoring memory from previous run $previous_id"
            gh run download "$previous_id" -n agent-memory
          else
            echo "No previous successful run found; starting fresh"
          fi
      - name: Run agent
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          MISTRAL_MODEL: ${{ inputs.model || 'mistral-small-latest' }}
          AGENT_PROMPT: ${{ inputs.prompt || (github.event_name == 'schedule' && 'Review the repository and update REPORT.md with any notable changes or findings since last time using the write_file tool. If you find a new, distinct problem worth tracking, search existing issues first and create an issue for it.') || 'Review this repository and write a short review to REPORT.md using the write_file tool. Then summarise your review in the reply.' }}
        run: python -m foxnaught --model "$MISTRAL_MODEL" --memory agent-memory.json --memory-archive MEMORY.md --one-shot "$AGENT_PROMPT"
      - name: Upload conversation memory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-memory
          path: |
            agent-memory.json
            MEMORY.md
          if-no-files-found: ignore
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: REPORT.md
          if-no-files-found: ignore
      - name: Commit report to main
        if: ${{ inputs.commit_report == true && hashFiles('REPORT.md') != '' }}
        run: |
          git config user.name "foxnaught-agent"
          git config user.email "foxnaught-agent@users.noreply.github.com"
          git add REPORT.md
          if git diff --cached --quiet; then
            echo "REPORT.md unchanged; nothing to commit"
          else
            git commit -m "Update REPORT.md (agent run ${{ github.run_id }})"
            git push
          fi
