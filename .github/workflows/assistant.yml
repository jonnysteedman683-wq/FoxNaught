name: Assistant

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: "Task for the assistant"
        required: true
        default: "Check the status of the most recent Agent run."

permissions:
  contents: read

concurrency:
  group: assistant-run
  cancel-in-progress: false

jobs:
  assist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: write
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/foxnaught') && !contains(github.event.comment.user.login, '[bot]')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Authorisation gate
        id: gate
        if: ${{ github.event_name == 'issue_comment' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMENTER: ${{ github.event.comment.user.login }}
          OWNER: ${{ github.repository_owner }}
          ALLOWED_LOGINS: ${{ vars.ASSISTANT_ALLOWED_LOGINS }}
          ISSUE_COMMENT_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ "$COMMENTER" = "$OWNER" ]; then
            echo "allowed by repository ownership"
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api "repos/$REPO/collaborators/$COMMENTER" >/dev/null 2>&1; then
            echo "allowed as a repository collaborator"
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$ALLOWED_LOGINS" ]; then
            for login in $(printf '%s' "$ALLOWED_LOGINS" | tr ',' '\n'); do
              if [ "$COMMENTER" = "$login" ]; then
                echo "allowed by the ASSISTANT_ALLOWED_LOGINS repository variable"
                echo "allowed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
          fi
          {
            printf '<!-- foxnaught-assistant -->\nAccess denied: only the repository owner, collaborators, or logins in the `ASSISTANT_ALLOWED_LOGINS` repository variable can trigger the Assistant.\n'
          } > comment.md
          gh issue comment "$ISSUE_COMMENT_NUMBER" --body-file comment.md
          echo "commenter $COMMENTER is not authorised; stopping"
          echo "allowed=false" >> "$GITHUB_OUTPUT"
      - name: Restore previous conversation memory
        if: ${{ steps.gate.outputs.allowed != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow assistant.yml --status success \
            --json databaseId --limit 20 \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }})][0].databaseId // empty")
          if [ -n "$previous_id" ]; then
            echo "Restoring memory from previous run $previous_id"
            gh run download "$previous_id" -n assistant-memory || echo "(no memory artifact; starting fresh)"
          else
            echo "No previous successful run found; starting fresh"
          fi
      - name: Run assistant
        if: ${{ steps.gate.outputs.allowed != 'false' }}
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          DISPATCH_PROMPT: ${{ inputs.prompt }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_LOGIN: ${{ github.event.comment.user.login }}
          ISSUE_COMMENT_NUMBER: ${{ github.event.issue.number }}
        run: |
          system='You are the FoxNaught Assistant, an on-call helper for this repository. You can dispatch workflows with dispatch_workflow, inspect runs with list_workflow_runs and view_run, and manage issues. When a request asks you to kick off, check, or re-run a workflow, use those tools rather than guessing; report exactly what you did and any run ids. When someone asks for a fresh start, pass the continue_from input set to fresh. Keep replies short.'
          if [ "$GITHUB_EVENT_NAME" = "issue_comment" ]; then
            task="Issue #$ISSUE_COMMENT_NUMBER comment by @$COMMENT_LOGIN: $COMMENT_BODY"
          else
            task="$DISPATCH_PROMPT"
          fi
          python -m foxnaught --memory assistant-memory.json --memory-archive ASSISTANT_MEMORY.md --system-prompt "$system" --one-shot "$task" > assistant-log.txt
          cat assistant-log.txt
      - name: Reply on the issue
        if: ${{ steps.gate.outputs.allowed != 'false' && github.event_name == 'issue_comment' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_COMMENT_NUMBER: ${{ github.event.issue.number }}
        run: |
          {
            printf '<!-- foxnaught-assistant -->\n'
            cat assistant-log.txt
          } > comment.md
          gh issue comment "$ISSUE_COMMENT_NUMBER" --body-file comment.md
      - name: Upload conversation memory
        if: ${{ steps.gate.outputs.allowed != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: assistant-memory
          path: |
            assistant-memory.json
            ASSISTANT_MEMORY.md
          if-no-files-found: ignore
